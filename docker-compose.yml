services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: horus
      POSTGRES_USER: horus_admin
      POSTGRES_PASSWORD: ${HORUS_DB_ADMIN_PASSWORD:?set HORUS_DB_ADMIN_PASSWORD}
      HORUS_INGEST_PASSWORD: ${HORUS_INGEST_PASSWORD:?set HORUS_INGEST_PASSWORD}
      HORUS_SCREEN_PASSWORD: ${HORUS_SCREEN_PASSWORD:?set HORUS_SCREEN_PASSWORD}
      HORUS_AUDIT_PASSWORD: ${HORUS_AUDIT_PASSWORD:?set HORUS_AUDIT_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
      - horus-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horus_admin -d horus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  horus-db-data:
